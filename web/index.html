<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Boutique en ligne Flutter + Firebase">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="firebase_ecommerce">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Boutique Firebase</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Indicateur affiché tant que Flutter charge (masqué ensuite par l'application) -->
  <style>
    #app-loading { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-family: sans-serif; color: #6750a4; background: #fff; }
    #app-loading .spinner { width: 42px; height: 42px; border: 4px solid #e6def7;
      border-top-color: #6750a4; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <div id="app-loading"><div class="spinner"></div><p>Chargement de la boutique…</p></div>
  <noscript>Veuillez activer JavaScript pour utiliser cette application.</noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
